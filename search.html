---
layout: default
title: Поиск рецептов
---

<h1>Поиск рецептов</h1>

<input type="text" id="search-input" placeholder="Введи название или эффект..." autocomplete="off">
<div id="results"></div>

<script src="https://unpkg.com/lunr/lunr.js"></script>
<script>
  let idx;
  let docs = [];

  fetch('{{ "/search.json" | relative_url }}')
    .then(res => res.json())
    .then(data => {
      docs = data;
      idx = lunr(function () {
        this.ref('url');
        this.field('title');
        this.field('content');

        docs.forEach(function (doc) {
          this.add(doc);
        }, this);
      });

      const input = document.getElementById('search-input');
      const results = document.getElementById('results');

      input.addEventListener('input', function () {
        const query = this.value.trim();
        results.innerHTML = '';

        if (query.length < 2) return;

        let matches;
        try {
          matches = idx.search(query + '*');
        } catch (e) {
          matches = idx.search(query);
        }

        if (matches.length === 0) {
          results.innerHTML = '<p>Ничего не найдено.</p>';
          return;
        }

        matches.forEach(function (m) {
          const doc = docs.find(d => d.url === m.ref);
          if (!doc) return;

          // Разбиваем содержимое на рецепты и ищем только те, где есть совпадение
          const blocks = doc.content.split(/- /).filter(b => b.trim().length > 0);
          const queryLower = query.toLowerCase();

          blocks.forEach(function (block) {
            if (block.toLowerCase().includes(queryLower)) {
              const div = document.createElement('div');
              div.className = 'search-result';
              div.innerHTML = '<pre>' + block.trim() + '</pre>';
              results.appendChild(div);
            }
          });
        });

        if (results.innerHTML === '') {
          results.innerHTML = '<p>Ничего не найдено.</p>';
        }
      });
    });
</script>
